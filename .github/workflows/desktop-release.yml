name: Desktop Windows release

on:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  build-nsis:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Build NSIS installer
        working-directory: desktop
        env:
          CASESIFTER_ANALYSIS_URL: ${{ vars.CASESIFTER_ANALYSIS_URL }}
          CASESIFTER_CONTROL_URL: ${{ vars.CASESIFTER_CONTROL_URL }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: CaseSifter-Windows-Setup
          path: desktop/dist/CaseSifter-Setup-*.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/CaseSifter-Setup-*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
