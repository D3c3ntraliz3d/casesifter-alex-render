server {
    listen 80;
    server_name _;
    client_max_body_size 110m;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    location / {
        try_files $uri /index.html;
    }
}
