# Container listens on HTTP; TLS 1.2+ (prefer 1.3) is terminated at the edge
# (Render / load balancer). HSTS + CSP still apply so browsers never fall back
# to cleartext once they have seen HTTPS.
server {
    listen 80;
    server_name _;
    client_max_body_size 110m;
    root /usr/share/nginx/html;
    index index.html;

    # Deny TRACE and other odd methods at the edge container.
    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
        return 405;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Resource-Policy same-site always;
    add_header X-Permitted-Cross-Domain-Policies none always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://casesifter-control.onrender.com https://casesifter-analysis.onrender.com https://app.casesifter.com https://www.casesifter.com https://casesifter.com https://*.ingest.sentry.io https://*.sentry.io; form-action 'self' https://checkout.stripe.com https://billing.stripe.com; upgrade-insecure-requests" always;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    # Same-origin control plane: Set-Cookie is first-party on the app host.
    # Upstream is substituted at container start (see Dockerfile / nginx templates).
    # Default matches production soft-launch control; alex overrides via env.
    location /v1/ {
        proxy_pass https://casesifter-control.onrender.com/v1/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host casesifter-control.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cookie_domain casesifter-control.onrender.com $host;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        try_files $uri /index.html;
    }
}
