services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      MAX_FILE_MB: "100"
    volumes:
      - exhibit-data:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  exhibit-data:
