services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Dockerfile bakes analysis for Render; local compose must stay vault for John.
      APP_MODE: ${APP_MODE:-vault}
      APP_ENV: ${APP_ENV:-development}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-*}
      MAX_FILE_MB: "250"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      CONTEXTUAL_MULTIMODAL: ${CONTEXTUAL_MULTIMODAL:-false}
      CONTEXTUAL_MAX_UPLOAD_MB: ${CONTEXTUAL_MAX_UPLOAD_MB:-15}
    volumes:
      - exhibit-data:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  exhibit-data:
