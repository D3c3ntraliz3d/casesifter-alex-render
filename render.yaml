# CaseSifter hybrid — ephemeral analysis + control plane + hosted web app (no document vault)
services:
  - type: web
    name: casesifter-analysis
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      - key: APP_MODE
        value: analysis
      - key: APP_ENV
        value: production
      # Soft-launch browser origins (not *). Include onrender fallbacks until DNS cuts over.
      - key: CORS_ALLOW_ORIGINS
        value: "https://app.casesifter.com,https://www.casesifter.com,https://casesifter.com,https://casesifter-app.onrender.com,https://casesifter-marketing.onrender.com"
      - key: EPHEMERAL_JOBS
        value: "true"
      - key: EPHEMERAL_TTL_HOURS
        value: "6"
      - key: SOURCE_FILE_RETENTION
        value: immediate
      - key: PERSIST_FACTS
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: FACT_MEMORY_MASTER_KEY
        sync: false
      - key: ENTITLEMENT_MODE
        value: cloud
      # Control plane used to validate browser session bearers on /api/v1/*
      - key: CLOUD_CONTROL_URL
        value: https://casesifter-control.onrender.com
      - key: ANALYSIS_API_KEYS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: CONTEXTUAL_MULTIMODAL
        value: "true"
      - key: OCR_MAX_PAGES
        value: "40"
      # Local PDF/OCR stays serial. Gemini stage runs in the web process (parallel).
      # Upgrade to Standard 2GB before beta firms.
      - key: SCAN_MAX_CONCURRENT
        value: "1"
      # 512 MB starter: keep Gemini small until plan is upgraded to 2 GB.
      - key: GEMINI_MAX_CONCURRENT
        value: "2"
      - key: GEMINI_MAX_INFLIGHT_MB
        value: "60"
      - key: SCAN_MEMORY_GUARD_MB
        value: "420"
      - key: SCAN_JOB_TIMEOUT_S
        value: "600"
      - key: SCAN_JOB_TIMEOUT_BASE_S
        value: "120"
      - key: SCAN_JOB_TIMEOUT_PER_PAGE_S
        value: "10"
      - key: GEMINI_STAGE_TIMEOUT_S
        value: "900"
      - key: GEMINI_ORPHAN_SOURCE_GRACE_S
        value: "60"
      # Gotcha verifier: auto picks Claude when ANTHROPIC_API_KEY is set; Gemini stays multimodal.
      - key: GOTCHA_VERIFY_PROVIDER
        value: auto
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-sonnet-4-5-20250929
      # Create a Python backend project in Sentry and put its DSN here (not the JS one).
      - key: SENTRY_BACKEND_DSN
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production

  - type: web
    name: casesifter-control
    runtime: docker
    dockerfilePath: ./control_plane/Dockerfile
    dockerContext: ./control_plane
    plan: starter
    healthCheckPath: /health
    buildFilter:
      paths:
        - control_plane/**
        - render.yaml
    envVars:
      # John sets these in Render Dashboard (or Blueprint sync:false secrets).
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Soft-launch: price_1UMIUnD6sOleRtjBjVbHzMdP ($79/seat/mo). Secrets stay in Dashboard.
      - key: STRIPE_PRICE_ID
        sync: false
      - key: CONTROL_ADMIN_TOKEN
        sync: false
      # Soft-launch return URL for Stripe Checkout (success/cancel).
      # Switch to https://app.casesifter.com after app CNAME + Render custom domain.
      - key: CASESIFTER_PUBLIC_URL
        value: https://casesifter-app.onrender.com
      - key: CASESIFTER_TRIAL_DAYS
        value: "14"
      # Soft-launch: invite optional (gate off).
      - key: CASESIFTER_INVITE_REQUIRED
        value: "false"
      - key: CASESIFTER_INVITE_CODES
        sync: false

  - type: web
    name: casesifter-app
    runtime: static
    rootDir: frontend
    # RENDER_GIT_COMMIT is injected by Render; write-build-info embeds it in /build-info.json
    buildCommand: npm ci && node scripts/write-build-info.mjs && npm run build
    staticPublishPath: dist
    buildFilter:
      paths:
        - frontend/**
        - render.yaml
    routes:
      # SPA fallback — existing files in dist (e.g. /build-info.json) are served first
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /index.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    # Custom domain app.casesifter.com — attach in Render Dashboard → casesifter-app → Custom Domains
    # (Blueprint cannot always bind domains without dashboard/API access.)
    # Vite inlines these at build time. After changing them: Clear build cache → Manual Deploy.
    envVars:
      - key: VITE_CONTROL_PLANE_URL
        value: https://casesifter-control.onrender.com
      - key: VITE_ANALYSIS_API_URL
        value: https://casesifter-analysis.onrender.com
      - key: VITE_SENTRY_ENVIRONMENT
        value: production
      - key: VITE_SENTRY_DSN
        sync: false

  - type: web
    name: casesifter-marketing
    runtime: static
    staticPublishPath: ./marketing
    buildFilter:
      paths:
        - marketing/**
        - render.yaml
    routes:
      # Desktop funnel retired — keep these even if CDN still has old binaries.
      - type: redirect
        source: /download.html
        destination: /signup.html
      - type: redirect
        source: /downloads/*
        destination: /signup.html
      - type: redirect
        source: /assets/downloads.json
        destination: /signup.html
    headers:
      - path: /*.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /
        name: Cache-Control
        value: public, max-age=0, must-revalidate
