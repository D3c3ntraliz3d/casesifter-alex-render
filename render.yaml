# CaseSifter hybrid — ephemeral analysis + control plane + hosted web app (no document vault)
services:
  - type: web
    name: casesifter-analysis
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Plan (Standard 2GB) is owned in the Render Dashboard — do not set `plan:` here.
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      - key: APP_MODE
        value: analysis
      - key: APP_ENV
        value: production
      # Soft-launch browser origins (not *). Include onrender fallbacks until DNS cuts over.
      - key: CORS_ALLOW_ORIGINS
        value: "https://app.casesifter.com,https://www.casesifter.com,https://casesifter.com,https://casesifter-app.onrender.com,https://casesifter-marketing.onrender.com"
      - key: EPHEMERAL_JOBS
        value: "true"
      - key: EPHEMERAL_TTL_HOURS
        value: "6"
      - key: SOURCE_FILE_RETENTION
        value: immediate
      - key: PERSIST_FACTS
        value: "true"
      # Internal Postgres URL — set in Dashboard (empty IP allow list; internal host only).
      - key: DATABASE_URL
        sync: false
      - key: FACT_MEMORY_MASTER_KEY
        sync: false
      - key: ENTITLEMENT_MODE
        value: cloud
      - key: CLOUD_CONTROL_URL
        value: https://casesifter-control.onrender.com
      # Must match casesifter-control SESSION_SECRET (Dashboard). Never generateValue.
      - key: SESSION_SECRET
        sync: false
      - key: SESSION_TTL_DAYS
        value: "30"
      - key: ANALYSIS_API_KEYS
        sync: false
      # Keys + model live only in Dashboard (sync:false) so blueprint sync cannot overwrite.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: CONTEXTUAL_MULTIMODAL
        value: "true"
      - key: OCR_MAX_PAGES
        value: "40"
      # Concurrency / memory caps: Dashboard-owned after Standard upgrade.
      - key: SCAN_MAX_CONCURRENT
        sync: false
      - key: GEMINI_MAX_CONCURRENT
        sync: false
      - key: GEMINI_MAX_INFLIGHT_MB
        sync: false
      - key: SCAN_MEMORY_GUARD_MB
        sync: false
      - key: SCAN_JOB_TIMEOUT_S
        value: "600"
      - key: SCAN_JOB_TIMEOUT_BASE_S
        value: "120"
      - key: SCAN_JOB_TIMEOUT_PER_PAGE_S
        value: "10"
      - key: GEMINI_STAGE_TIMEOUT_S
        value: "900"
      - key: GEMINI_ORPHAN_SOURCE_GRACE_S
        value: "60"
      - key: GOTCHA_VERIFY_PROVIDER
        value: auto
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        sync: false
      - key: SENTRY_BACKEND_DSN
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production

  - type: web
    name: casesifter-control
    runtime: docker
    dockerfilePath: ./control_plane/Dockerfile
    dockerContext: ./control_plane
    # Plan owned in Dashboard — do not set `plan:` here.
    healthCheckPath: /health
    buildFilter:
      paths:
        - control_plane/**
        - render.yaml
    # Disk keeps accounts.json for one-time migration + session_secret pin.
    disk:
      name: casesifter-control-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: CONTROL_DATA_DIR
        value: /var/data
      - key: APP_ENV
        value: production
      # Same internal Postgres as analysis (cp_* auth tables). Set in Dashboard before deploy.
      - key: DATABASE_URL
        sync: false
      # Must match casesifter-analysis SESSION_SECRET. Do NOT use generateValue.
      - key: SESSION_SECRET
        sync: false
      - key: SESSION_TTL_DAYS
        value: "30"
      - key: CONTROL_CORS_ORIGINS
        value: "https://app.casesifter.com,https://www.casesifter.com,https://casesifter.com,https://casesifter-app.onrender.com,https://casesifter-marketing.onrender.com"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: CONTROL_ADMIN_TOKEN
        sync: false
      - key: CASESIFTER_PUBLIC_URL
        value: https://casesifter-app.onrender.com
      - key: CASESIFTER_TRIAL_DAYS
        value: "14"
      - key: CASESIFTER_INVITE_REQUIRED
        value: "false"
      - key: CASESIFTER_INVITE_CODES
        sync: false

  - type: web
    name: casesifter-app
    runtime: static
    rootDir: frontend
    # RENDER_GIT_COMMIT is injected by Render; write-build-info embeds it in /build-info.json
    buildCommand: npm ci && node scripts/write-build-info.mjs && npm run build
    staticPublishPath: dist
    buildFilter:
      paths:
        - frontend/**
        - render.yaml
    routes:
      # SPA fallback — existing files in dist (e.g. /build-info.json) are served first
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /index.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    # Custom domain app.casesifter.com — attach in Render Dashboard → casesifter-app → Custom Domains
    # (Blueprint cannot always bind domains without dashboard/API access.)
    # Vite inlines these at build time. After changing them: Clear build cache → Manual Deploy.
    envVars:
      - key: VITE_CONTROL_PLANE_URL
        value: https://casesifter-control.onrender.com
      - key: VITE_ANALYSIS_API_URL
        value: https://casesifter-analysis.onrender.com
      - key: VITE_SENTRY_ENVIRONMENT
        value: production
      - key: VITE_SENTRY_DSN
        sync: false

  - type: web
    name: casesifter-marketing
    runtime: static
    staticPublishPath: ./marketing
    buildFilter:
      paths:
        - marketing/**
        - render.yaml
    routes:
      # Desktop funnel retired — keep these even if CDN still has old binaries.
      - type: redirect
        source: /download.html
        destination: /signup.html
      - type: redirect
        source: /downloads/*
        destination: /signup.html
      - type: redirect
        source: /assets/downloads.json
        destination: /signup.html
    headers:
      - path: /*.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /
        name: Cache-Control
        value: public, max-age=0, must-revalidate
