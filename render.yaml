# CaseSifter hybrid — ephemeral analysis + control plane (no document vault)
services:
  - type: web
    name: casesifter-analysis
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Override CMD so Render's injected PORT is always honored at start.
    dockerCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    plan: starter
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: EPHEMERAL_JOBS
        value: "true"
      - key: EPHEMERAL_TTL_HOURS
        value: "6"
      - key: ENTITLEMENT_MODE
        value: open
      - key: ANALYSIS_API_KEYS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: CONTEXTUAL_MULTIMODAL
        value: "true"
      - key: OCR_MAX_PAGES
        value: "40"
      # Gotcha verifier: auto picks Claude when ANTHROPIC_API_KEY is set; Gemini stays multimodal.
      - key: GOTCHA_VERIFY_PROVIDER
        value: auto
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-sonnet-4-5-20250929
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production

  # Native Python — no Docker/Tesseract needed; avoids Oregon Docker deploy failures.
  - type: web
    name: casesifter-control
    runtime: python
    rootDir: control_plane
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    plan: starter
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: CONTROL_ADMIN_TOKEN
        sync: false
      - key: CASESIFTER_PUBLIC_URL
        sync: false
      - key: CASESIFTER_TRIAL_DAYS
        value: "14"

  - type: web
    name: casesifter-marketing
    runtime: static
    staticPublishPath: ./marketing
