# CaseSifter hybrid — ephemeral analysis + control plane + hosted web app (no document vault)
#
# Shared secrets: both services pull SESSION_SECRET from envVarGroup casesifter-auth
# so they always match (no manual copy). generateValue sets once; re-sync does not rotate.
envVarGroups:
  - name: casesifter-auth
    envVars:
      - key: SESSION_SECRET
        generateValue: true

services:
  - type: web
    name: casesifter-analysis
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Plan (Standard 2GB) is owned in the Render Dashboard — do not set `plan:` here.
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      - fromGroup: casesifter-auth
      - key: APP_MODE
        value: analysis
      - key: APP_ENV
        value: production
      # Soft-launch browser origins (not *). Include onrender fallbacks until DNS cuts over.
      - key: CORS_ALLOW_ORIGINS
        value: "https://app.casesifter.com,https://www.casesifter.com,https://casesifter.com,https://casesifter-app.onrender.com,https://casesifter-marketing.onrender.com"
      - key: EPHEMERAL_JOBS
        value: "true"
      - key: EPHEMERAL_TTL_HOURS
        value: "6"
      - key: SOURCE_FILE_RETENTION
        value: s3
      - key: PERSIST_FACTS
        value: "true"
      # Internal Postgres URL — set in Dashboard (empty IP allow list; internal host only).
      - key: DATABASE_URL
        sync: false
      - key: FACT_MEMORY_MASTER_KEY
        sync: false
      - key: ENTITLEMENT_MODE
        value: cloud
      - key: CLOUD_CONTROL_URL
        value: https://casesifter-control.onrender.com
      - key: SESSION_TTL_DAYS
        value: "30"
      - key: ANALYSIS_API_KEYS
        sync: false
      # Keys live only in Dashboard (sync:false) so blueprint sync cannot overwrite.
      - key: GEMINI_API_KEY
        sync: false
      - key: CONTEXTUAL_MULTIMODAL
        value: "true"
      - key: OCR_MAX_PAGES
        value: "40"
      # Exhibit lane = TASK_* (best). Non-exhibit = GEMINI_LIGHT_* (cheapest).
      - key: TASK_A_EXTRACT_PRIMARY
        value: "gemini-3.6-flash"
      - key: TASK_A_EXTRACT_BACKUP
        value: "gemini-3.5-flash-lite"
      - key: TASK_A_EXTRACT_THINKING_LEVEL
        value: "minimal"
      - key: TASK_B_ENTITY_PRIMARY
        value: "gemini-3.8-flash"
      - key: TASK_B_ENTITY_BACKUP
        value: "gemini-3.6-flash"
      - key: TASK_B_ENTITY_THINKING_LEVEL
        value: "medium"
      - key: TASK_C_CONTRA_PRIMARY
        value: "gemini-3.8-flash"
      - key: TASK_C_CONTRA_BACKUP
        value: "gemini-3.6-flash"
      - key: TASK_C_CONTRA_THINKING_LEVEL
        value: "high"
      - key: TASK_D_VISUAL_PRIMARY
        value: "gemini-3.8-flash"
      - key: TASK_D_VISUAL_BACKUP
        value: "gemini-3.5-flash-lite"
      - key: TASK_D_VISUAL_THINKING_LEVEL
        value: "medium"
      - key: GEMINI_LIGHT_PRIMARY
        value: "gemini-3.5-flash-lite"
      - key: GEMINI_LIGHT_BACKUP
        value: "gemini-3.5-flash-lite"
      - key: GEMINI_LIGHT_THINKING_LEVEL
        value: "minimal"
      - key: GEMINI_SERVICE_TIER
        value: "standard"
      # Concurrency / memory caps: Dashboard-owned after Standard upgrade.
      # Keep GEMINI_MAX_CONCURRENT=2 while Google 503/overloaded rates are high.
      - key: SCAN_MAX_CONCURRENT
        sync: false
      - key: GEMINI_MAX_CONCURRENT
        sync: false
      - key: GEMINI_MAX_INFLIGHT_MB
        sync: false
      - key: SCAN_MEMORY_GUARD_MB
        sync: false
      - key: SCAN_JOB_TIMEOUT_S
        value: "600"
      - key: SCAN_JOB_TIMEOUT_BASE_S
        value: "120"
      - key: SCAN_JOB_TIMEOUT_PER_PAGE_S
        value: "10"
      - key: GEMINI_STAGE_TIMEOUT_S
        value: "900"
      - key: GEMINI_ORPHAN_SOURCE_GRACE_S
        value: "60"
      - key: GOTCHA_VERIFY_PROVIDER
        value: auto
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        sync: false
      - key: SENTRY_BACKEND_DSN
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      # --- Scale Phase 3: scans run on casesifter-scan-worker (R2 + Redis).
      # Rollback: set SCAN_BACKEND back to inline (revert this commit).
      # R2 keys + WORKER_SERVICE_TOKEN come from a Dashboard env group linked by hand
      # (not declared here, so a sync can never blank them).
      - key: SCAN_BACKEND
        value: worker
      - key: BLOB_BACKEND
        value: s3
      - key: QUEUE_BACKEND
        value: redis
      - key: S3_BUCKET
        value: casesifter
      - key: S3_ENDPOINT_URL
        value: https://a860da2299bdcd448a40c99cca302236.r2.cloudflarestorage.com
      - key: S3_REGION
        value: auto
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: casesifter-queue
          property: connectionString

  # Shared scan job queue. noeviction: a full queue must reject writes, never
  # silently drop jobs (the default allkeys-lru would). Private network only.
  - type: keyvalue
    name: casesifter-queue
    region: oregon
    plan: 256mb
    maxmemoryPolicy: noeviction
    ipAllowList: []

  # Scan worker: claims jobs from Redis, pulls the bundle from R2, runs OCR +
  # Gemini, and POSTs the result back to the analysis service over the private
  # network. No database or fact-memory keys by design.
  - type: worker
    name: casesifter-scan-worker
    runtime: docker
    region: oregon
    plan: 1c-2g
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: python -m worker.main
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      - key: APP_MODE
        value: analysis
      - key: APP_ENV
        value: production
      # Keep tiny matter PDFs in R2 for re-scan (same as analysis service).
      - key: SOURCE_FILE_RETENTION
        value: s3
      - key: SCAN_BACKEND
        value: worker
      - key: BLOB_BACKEND
        value: s3
      - key: QUEUE_BACKEND
        value: redis
      - key: S3_BUCKET
        value: casesifter
      - key: S3_ENDPOINT_URL
        value: https://a860da2299bdcd448a40c99cca302236.r2.cloudflarestorage.com
      - key: S3_REGION
        value: auto
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: casesifter-queue
          property: connectionString
      - key: WORKER_CALLBACK_BASE_URL
        fromService:
          type: web
          name: casesifter-analysis
          property: hostport
      - key: WORKER_MAX_ATTEMPTS
        value: "3"
      # Jobs per worker instance, each in its own process. Scans are mostly
      # waiting on Gemini; watch memory (2 GB) before raising.
      - key: WORKER_CONCURRENCY
        value: "3"
      - key: WORKER_JOB_TIMEOUT_S
        value: "1800"
      # Pipeline settings (same values as the analysis service).
      - key: GEMINI_API_KEY
        sync: false
      # Exhibit lane = TASK_* (best). Non-exhibit = GEMINI_LIGHT_* (cheapest).
      - key: TASK_A_EXTRACT_PRIMARY
        value: "gemini-3.6-flash"
      - key: TASK_A_EXTRACT_BACKUP
        value: "gemini-3.5-flash-lite"
      - key: TASK_A_EXTRACT_THINKING_LEVEL
        value: "minimal"
      - key: TASK_B_ENTITY_PRIMARY
        value: "gemini-3.8-flash"
      - key: TASK_B_ENTITY_BACKUP
        value: "gemini-3.6-flash"
      - key: TASK_B_ENTITY_THINKING_LEVEL
        value: "medium"
      - key: TASK_C_CONTRA_PRIMARY
        value: "gemini-3.8-flash"
      - key: TASK_C_CONTRA_BACKUP
        value: "gemini-3.6-flash"
      - key: TASK_C_CONTRA_THINKING_LEVEL
        value: "high"
      - key: TASK_D_VISUAL_PRIMARY
        value: "gemini-3.8-flash"
      - key: TASK_D_VISUAL_BACKUP
        value: "gemini-3.5-flash-lite"
      - key: TASK_D_VISUAL_THINKING_LEVEL
        value: "medium"
      - key: GEMINI_LIGHT_PRIMARY
        value: "gemini-3.5-flash-lite"
      - key: GEMINI_LIGHT_BACKUP
        value: "gemini-3.5-flash-lite"
      - key: GEMINI_LIGHT_THINKING_LEVEL
        value: "minimal"
      - key: GEMINI_SERVICE_TIER
        value: "standard"
      - key: GEMINI_MAX_CONCURRENT
        sync: false
      - key: GEMINI_MAX_INFLIGHT_MB
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        sync: false
      - key: GOTCHA_VERIFY_PROVIDER
        value: auto
      - key: CONTEXTUAL_MULTIMODAL
        value: "true"
      - key: OCR_MAX_PAGES
        value: "40"
      - key: SCAN_JOB_TIMEOUT_S
        value: "600"
      - key: SCAN_JOB_TIMEOUT_BASE_S
        value: "120"
      - key: SCAN_JOB_TIMEOUT_PER_PAGE_S
        value: "10"
      - key: GEMINI_STAGE_TIMEOUT_S
        value: "900"
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_BACKEND_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production

  - type: web
    name: casesifter-control
    runtime: docker
    dockerfilePath: ./control_plane/Dockerfile
    dockerContext: ./control_plane
    # Plan owned in Dashboard — do not set `plan:` here.
    healthCheckPath: /health
    buildFilter:
      paths:
        - control_plane/**
        - render.yaml
    # Disk keeps accounts.json for one-time migration + session_secret pin.
    disk:
      name: casesifter-control-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - fromGroup: casesifter-auth
      - key: CONTROL_DATA_DIR
        value: /var/data
      - key: APP_ENV
        value: production
      # Internal URL of casesifter-fact-memory (private network; IP allow list empty).
      - key: DATABASE_URL
        fromDatabase:
          name: casesifter-fact-memory
          property: connectionString
      - key: SESSION_TTL_DAYS
        value: "30"
      - key: CONTROL_CORS_ORIGINS
        value: "https://app.casesifter.com,https://www.casesifter.com,https://casesifter.com,https://casesifter-app.onrender.com,https://casesifter-marketing.onrender.com"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: CONTROL_ADMIN_TOKEN
        sync: false
      - key: CASESIFTER_PUBLIC_URL
        value: https://casesifter-app.onrender.com
      - key: CASESIFTER_TRIAL_DAYS
        value: "14"
      - key: CASESIFTER_INVITE_REQUIRED
        value: "false"
      - key: CASESIFTER_INVITE_CODES
        sync: false
      - key: CASESIFTER_MARKETING_URL
        value: https://casesifter.com
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: casesifter-queue
          property: connectionString
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_USE_TLS
        value: "true"

  - type: web
    name: casesifter-app
    runtime: static
    rootDir: frontend
    # RENDER_GIT_COMMIT is injected by Render; write-build-info embeds it in /build-info.json
    buildCommand: npm ci && node scripts/write-build-info.mjs && npm run build
    staticPublishPath: dist
    buildFilter:
      paths:
        - frontend/**
        - render.yaml
    routes:
      # Same-origin control + analysis (match alex): first-party cookies; listed before SPA fallback.
      - type: rewrite
        source: /v1/*
        destination: https://casesifter-control.onrender.com/v1/*
      - type: rewrite
        source: /api/*
        destination: https://casesifter-analysis.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /index.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains; preload
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Cross-Origin-Resource-Policy
        value: same-site
      - path: /*
        name: X-Permitted-Cross-Domain-Policies
        value: none
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://*.ingest.sentry.io https://*.sentry.io; form-action 'self' https://checkout.stripe.com https://billing.stripe.com; upgrade-insecure-requests"
    # Custom domain app.casesifter.com — attach in Render Dashboard → casesifter-app → Custom Domains
    # Vite inlines SAME_ORIGIN at build time. After changing: Clear build cache → Manual Deploy.
    envVars:
      - key: VITE_CONTROL_SAME_ORIGIN
        value: "1"
      - key: VITE_CONTROL_PLANE_URL
        value: ""
      - key: VITE_ANALYSIS_SAME_ORIGIN
        value: "1"
      - key: VITE_ANALYSIS_API_URL
        value: ""
      - key: VITE_SENTRY_ENVIRONMENT
        value: production
      - key: VITE_SENTRY_DSN
        sync: false

  - type: web
    name: casesifter-marketing
    runtime: static
    staticPublishPath: ./marketing
    buildFilter:
      paths:
        - marketing/**
        - render.yaml
    routes:
      # Desktop funnel retired — keep these even if CDN still has old binaries.
      - type: redirect
        source: /download.html
        destination: /signup.html
      - type: redirect
        source: /downloads/*
        destination: /signup.html
      - type: redirect
        source: /assets/downloads.json
        destination: /signup.html
    headers:
      - path: /*.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains; preload
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Cross-Origin-Resource-Policy
        value: same-site
      - path: /*
        name: X-Permitted-Cross-Domain-Policies
        value: none
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://casesifter-control.onrender.com https://casesifter-analysis.onrender.com https://app.casesifter.com https://www.casesifter.com https://casesifter.com https://*.ingest.sentry.io https://*.sentry.io; form-action 'self'; upgrade-insecure-requests"
