# CaseSifter hybrid — ephemeral analysis + control plane (no document vault)
services:
  - type: web
    name: casesifter-analysis
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      - key: APP_MODE
        value: analysis
      - key: APP_ENV
        value: production
      - key: CORS_ALLOW_ORIGINS
        value: "https://casesifter.com,https://www.casesifter.com,https://casesifter-marketing.onrender.com"
      - key: EPHEMERAL_JOBS
        value: "true"
      - key: EPHEMERAL_TTL_HOURS
        value: "6"
      - key: ENTITLEMENT_MODE
        value: open
      - key: ANALYSIS_API_KEYS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: CONTEXTUAL_MULTIMODAL
        value: "true"
      - key: OCR_MAX_PAGES
        value: "40"
      # Gotcha verifier: auto picks Claude when ANTHROPIC_API_KEY is set; Gemini stays multimodal.
      - key: GOTCHA_VERIFY_PROVIDER
        value: auto
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-sonnet-4-5-20250929
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production

  - type: web
    name: casesifter-control
    runtime: docker
    dockerfilePath: ./control_plane/Dockerfile
    dockerContext: ./control_plane
    plan: starter
    healthCheckPath: /health
    buildFilter:
      paths:
        - control_plane/**
        - render.yaml
    envVars:
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: CONTROL_ADMIN_TOKEN
        sync: false
      - key: CASESIFTER_PUBLIC_URL
        sync: false
      - key: CASESIFTER_TRIAL_DAYS
        value: "14"

  - type: web
    name: casesifter-marketing
    runtime: static
    staticPublishPath: ./marketing
    buildFilter:
      paths:
        - marketing/**
        - render.yaml
