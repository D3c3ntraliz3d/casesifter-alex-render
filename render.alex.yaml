# CaseSifter — Alex parallel stack (SAFE route)
# Distinct names only. Do NOT manage or retarget John's casesifter-* services.
# Blueprint path: render.alex.yaml  |  repo: D3c3ntraliz3d/court-exhibit-scanner2
#
# Shared secrets: SESSION_SECRET from envVarGroup casesifter-alex-auth
# so control + analysis always match (generateValue sets once; re-sync does not rotate).
envVarGroups:
  - name: casesifter-alex-auth
    envVars:
      - key: SESSION_SECRET
        generateValue: true
  # Durable secrets for analysis + scan-worker. Linked via fromGroup so a
  # service-level env PUT / partial sync cannot drop GEMINI/FACT/S3 keys.
  # Values are Dashboard/API-only (sync: false) — never commit secret values.
  - name: casesifter-alex-secrets
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: FACT_MEMORY_MASTER_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: GEMINI_MAX_CONCURRENT
        sync: false
      - key: GEMINI_MAX_INFLIGHT_MB
        sync: false
      - key: SENTRY_DSN
        sync: false
      # Do not declare SENTRY_BACKEND_DSN here until the group has a real
      # value — empty sync:false on a new group key can blank linked services.
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        sync: false
      - key: WORKER_SERVICE_TOKEN
        sync: false
      # Backup copies of linked resources — primary still fromDatabase/fromService.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SOURCE_FILE_RETENTION
        value: s3
  - name: casesifter-alex-r2
    envVars:
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: WORKER_SERVICE_TOKEN
        sync: false

databases:
  # Private network only (empty IP allow list). Control + analysis use this.
  - name: casesifter-alex-fact-memory
    plan: basic-256mb
    databaseName: fact_memory
    user: casesifter
    ipAllowList: []

services:
  - type: web
    name: casesifter-alex-analysis
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Plan owned in Dashboard — do not set `plan:` here.
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - backend/**
        - render.alex.yaml
    envVars:
      - fromGroup: casesifter-alex-auth
      - fromGroup: casesifter-alex-secrets
      - fromGroup: casesifter-alex-r2
      - key: APP_MODE
        value: analysis
      - key: APP_ENV
        value: production
      # Alex onrender origins only — not casesifter.com / John's hosts.
      - key: CORS_ALLOW_ORIGINS
        value: "https://casesifter-alex-app.onrender.com,https://casesifter-alex-marketing.onrender.com"
      - key: EPHEMERAL_JOBS
        value: "true"
      - key: EPHEMERAL_TTL_HOURS
        value: "6"
      # SOURCE_FILE_RETENTION also in casesifter-alex-secrets (=s3). Keep here so
      # blueprint service config cannot drift if the group link is missing.
      - key: SOURCE_FILE_RETENTION
        value: s3
      - key: PERSIST_FACTS
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: casesifter-alex-fact-memory
          property: connectionString
      - key: ENTITLEMENT_MODE
        value: cloud
      - key: CLOUD_CONTROL_URL
        value: https://casesifter-alex-control.onrender.com
      - key: SESSION_TTL_DAYS
        value: "30"
      - key: ANALYSIS_API_KEYS
        sync: false
      - key: CONTEXTUAL_MULTIMODAL
        value: "true"
      - key: OCR_MAX_PAGES
        value: "40"
      # Exhibit / forensic lane — best available (TASK_*).
      - key: TASK_A_EXTRACT_PRIMARY
        value: "gemini-3.6-flash"
      - key: TASK_A_EXTRACT_BACKUP
        value: "gemini-3.5-flash-lite"
      - key: TASK_A_EXTRACT_THINKING_LEVEL
        value: "minimal"
      - key: TASK_B_ENTITY_PRIMARY
        value: "gemini-3.8-flash"
      - key: TASK_B_ENTITY_BACKUP
        value: "gemini-3.6-flash"
      - key: TASK_B_ENTITY_THINKING_LEVEL
        value: "medium"
      - key: TASK_C_CONTRA_PRIMARY
        value: "gemini-3.8-flash"
      - key: TASK_C_CONTRA_BACKUP
        value: "gemini-3.6-flash"
      - key: TASK_C_CONTRA_THINKING_LEVEL
        value: "high"
      - key: TASK_D_VISUAL_PRIMARY
        value: "gemini-3.8-flash"
      - key: TASK_D_VISUAL_BACKUP
        value: "gemini-3.5-flash-lite"
      - key: TASK_D_VISUAL_THINKING_LEVEL
        value: "medium"
      # Non-exhibit / court_filing lane — cheapest/lightest.
      - key: GEMINI_LIGHT_PRIMARY
        value: "gemini-3.5-flash-lite"
      - key: GEMINI_LIGHT_BACKUP
        value: "gemini-3.5-flash-lite"
      - key: GEMINI_LIGHT_THINKING_LEVEL
        value: "minimal"
      - key: GEMINI_SERVICE_TIER
        value: "standard"
      - key: SCAN_MAX_CONCURRENT
        sync: false
      - key: SCAN_MEMORY_GUARD_MB
        sync: false
      - key: SCAN_JOB_TIMEOUT_S
        value: "600"
      - key: SCAN_JOB_TIMEOUT_BASE_S
        value: "120"
      - key: SCAN_JOB_TIMEOUT_PER_PAGE_S
        value: "10"
      - key: GEMINI_STAGE_TIMEOUT_S
        value: "900"
      - key: GEMINI_ORPHAN_SOURCE_GRACE_S
        value: "60"
      - key: GOTCHA_VERIFY_PROVIDER
        value: auto
      - key: SENTRY_ENVIRONMENT
        value: production
      # Scans run on casesifter-alex-scan-worker (R2 + Redis).
      # Secrets (GEMINI/FACT/S3/WORKER_TOKEN) live in casesifter-alex-secrets +
      # casesifter-alex-r2 — do not redeclare as service sync:false or a wipe
      # can leave empty service-level keys that override the groups.
      - key: SCAN_BACKEND
        value: worker
      - key: BLOB_BACKEND
        value: s3
      - key: QUEUE_BACKEND
        value: redis
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: casesifter-alex-queue
          property: connectionString

  - type: keyvalue
    name: casesifter-alex-queue
    region: oregon
    plan: 256mb
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: worker
    name: casesifter-alex-scan-worker
    runtime: docker
    region: oregon
    plan: 1c-2g
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: python -m worker.main
    buildFilter:
      paths:
        - backend/**
        - render.alex.yaml
    envVars:
      - fromGroup: casesifter-alex-secrets
      - fromGroup: casesifter-alex-r2
      - key: APP_MODE
        value: analysis
      - key: APP_ENV
        value: production
      - key: SOURCE_FILE_RETENTION
        value: s3
      - key: SCAN_BACKEND
        value: worker
      - key: BLOB_BACKEND
        value: s3
      - key: QUEUE_BACKEND
        value: redis
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: casesifter-alex-queue
          property: connectionString
      - key: WORKER_CALLBACK_BASE_URL
        fromService:
          type: web
          name: casesifter-alex-analysis
          property: hostport
      - key: WORKER_MAX_ATTEMPTS
        value: "3"
      - key: WORKER_CONCURRENCY
        value: "3"
      - key: WORKER_JOB_TIMEOUT_S
        value: "1800"
      - key: TASK_A_EXTRACT_PRIMARY
        value: "gemini-3.6-flash"
      - key: TASK_A_EXTRACT_BACKUP
        value: "gemini-3.5-flash-lite"
      - key: TASK_A_EXTRACT_THINKING_LEVEL
        value: "minimal"
      - key: TASK_B_ENTITY_PRIMARY
        value: "gemini-3.8-flash"
      - key: TASK_B_ENTITY_BACKUP
        value: "gemini-3.6-flash"
      - key: TASK_B_ENTITY_THINKING_LEVEL
        value: "medium"
      - key: TASK_C_CONTRA_PRIMARY
        value: "gemini-3.8-flash"
      - key: TASK_C_CONTRA_BACKUP
        value: "gemini-3.6-flash"
      - key: TASK_C_CONTRA_THINKING_LEVEL
        value: "high"
      - key: TASK_D_VISUAL_PRIMARY
        value: "gemini-3.8-flash"
      - key: TASK_D_VISUAL_BACKUP
        value: "gemini-3.5-flash-lite"
      - key: TASK_D_VISUAL_THINKING_LEVEL
        value: "medium"
      - key: GEMINI_LIGHT_PRIMARY
        value: "gemini-3.5-flash-lite"
      - key: GEMINI_LIGHT_BACKUP
        value: "gemini-3.5-flash-lite"
      - key: GEMINI_LIGHT_THINKING_LEVEL
        value: "minimal"
      - key: GEMINI_SERVICE_TIER
        value: "standard"
      - key: GOTCHA_VERIFY_PROVIDER
        value: auto
      - key: CONTEXTUAL_MULTIMODAL
        value: "true"
      - key: OCR_MAX_PAGES
        value: "40"
      - key: SCAN_JOB_TIMEOUT_S
        value: "600"
      - key: SCAN_JOB_TIMEOUT_BASE_S
        value: "120"
      - key: SCAN_JOB_TIMEOUT_PER_PAGE_S
        value: "10"
      - key: GEMINI_STAGE_TIMEOUT_S
        value: "900"
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: PERSIST_FACTS
        value: "true"

  - type: web
    name: casesifter-alex-control
    runtime: docker
    dockerfilePath: ./control_plane/Dockerfile
    dockerContext: ./control_plane
    healthCheckPath: /health
    buildFilter:
      paths:
        - control_plane/**
        - render.alex.yaml
    disk:
      name: casesifter-alex-control-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - fromGroup: casesifter-alex-auth
      - key: CONTROL_DATA_DIR
        value: /var/data
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: casesifter-alex-fact-memory
          property: connectionString
      - key: SESSION_TTL_DAYS
        value: "30"
      - key: CONTROL_CORS_ORIGINS
        value: "https://casesifter-alex-app.onrender.com,https://casesifter-alex-marketing.onrender.com"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: CONTROL_ADMIN_TOKEN
        sync: false
      - key: CASESIFTER_PUBLIC_URL
        value: https://casesifter-alex-app.onrender.com
      - key: CASESIFTER_TRIAL_DAYS
        value: "14"
      - key: CASESIFTER_INVITE_REQUIRED
        value: "false"
      # Demo-friendly: signup marks verified; login skips verify gate.
      - key: CASESIFTER_REQUIRE_EMAIL_VERIFY
        value: "false"
      - key: CASESIFTER_INVITE_CODES
        sync: false
      - key: CASESIFTER_MARKETING_URL
        value: https://casesifter-alex-marketing.onrender.com
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: casesifter-alex-queue
          property: connectionString
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_USE_TLS
        value: "true"

  - type: web
    name: casesifter-alex-app
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && node scripts/write-build-info.mjs && npm run build
    staticPublishPath: dist
    buildFilter:
      paths:
        - frontend/**
        - control_plane/**
        - render.alex.yaml
    routes:
      # Same-origin control + analysis: browser sees Set-Cookie on the app host
      # (first-party). Must be listed before the SPA fallback rewrite.
      - type: rewrite
        source: /v1/*
        destination: https://casesifter-alex-control.onrender.com/v1/*
      - type: rewrite
        source: /api/*
        destination: https://casesifter-alex-analysis.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /index.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains; preload
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Cross-Origin-Resource-Policy
        value: same-site
      - path: /*
        name: X-Permitted-Cross-Domain-Policies
        value: none
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://*.ingest.sentry.io https://*.sentry.io; form-action 'self' https://checkout.stripe.com https://billing.stripe.com; upgrade-insecure-requests"
    envVars:
      # Relative /v1 and /api via rewrites — first-party cookies for ChatGPT/embedded browsers.
      - key: VITE_CONTROL_SAME_ORIGIN
        value: "1"
      - key: VITE_CONTROL_PLANE_URL
        value: ""
      - key: VITE_ANALYSIS_SAME_ORIGIN
        value: "1"
      - key: VITE_ANALYSIS_API_URL
        value: ""
      - key: VITE_SENTRY_ENVIRONMENT
        value: production
      - key: VITE_SENTRY_DSN
        sync: false

  - type: web
    name: casesifter-alex-marketing
    runtime: static
    staticPublishPath: ./marketing
    buildFilter:
      paths:
        - marketing/**
        - render.alex.yaml
    routes:
      - type: redirect
        source: /download.html
        destination: /signup.html
      - type: redirect
        source: /downloads/*
        destination: /signup.html
      - type: redirect
        source: /assets/downloads.json
        destination: /signup.html
    headers:
      - path: /*.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains; preload
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Cross-Origin-Resource-Policy
        value: same-site
      - path: /*
        name: X-Permitted-Cross-Domain-Policies
        value: none
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://casesifter-alex-control.onrender.com https://casesifter-alex-analysis.onrender.com https://*.ingest.sentry.io https://*.sentry.io; form-action 'self'; upgrade-insecure-requests"
